<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bozor Bot | Sotuvchi paneli</title>
    <meta name="description" content="Bozor Bot sotuvchi paneli" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar compact">
        <a href="index.html" class="brand">
          <div class="brand-mark">B</div>
          <div>
            <div class="brand-name">Bozor Bot</div>
          </div>
        </a>
        <button class="secondary-btn">+ Mahsulot</button>
      </header>

      <section class="seller-hero">
        <div>
          <div class="eyebrow">Sotuvchi kabineti</div>
          <h1>Aziza Shop</h1>
        </div>
        <div class="avatar">A</div>
      </section>

      <section class="stats-grid small">
        <article class="stat-card">
          <div class="stat-label">Daromad</div>
          <div class="stat-value">$4.2K</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">Buyurtmalar</div>
          <div class="stat-value">86</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">Reyting</div>
          <div class="stat-value">4.9</div>
        </article>
      </section>

      <section class="section-block">
        <div class="section-head">
          <h2>Mening mahsulotlarim</h2>
          <a href="products.html">Barchasi</a>
        </div>

        <div class="seller-product-list">
          <div class="seller-product">
            <div class="product-thumb green">🧴</div>
            <div class="seller-product-meta">
              <strong>Premium oil</strong>
              <span>134 ta sotilgan</span>
            </div>
            <span class="price-tag">$28</span>
          </div>

          <div class="seller-product">
            <div class="product-thumb blue">📱</div>
            <div class="seller-product-meta">
              <strong>Smart Watch</strong>
              <span>89 ta sotilgan</span>
            </div>
            <span class="price-tag">$99</span>
          </div>

          <div class="seller-product">
            <div class="product-thumb yellow">🥤</div>
            <div class="seller-product-meta">
              <strong>Fresh Drink</strong>
              <span>54 ta sotilgan</span>
            </div>
            <span class="price-tag">$12</span>
          </div>
        </div>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="Asosiy navigatsiya">
      <a class="nav-item" href="index.html">
        <span class="nav-ico">⌂</span>
        <span>Home</span>
      </a>
      <a class="nav-item" href="products.html">
        <span class="nav-ico">◫</span>
        <span>Mahsulot</span>
      </a>
      <a class="nav-item" href="cart.html">
        <span class="nav-ico">🛒</span>
        <span>Savatcha</span>
      </a>
      <a class="nav-item active" href="seller.html">
        <span class="nav-ico">☰</span>
        <span>Seller</span>
      </a>
    </nav>

    <script src="script.js"></script>
  </body>
</html>
