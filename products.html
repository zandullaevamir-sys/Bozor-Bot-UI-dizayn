<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bozor Bot | Mahsulotlar</title>
    <meta name="description" content="Bozor Bot mahsulotlar katalogi" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar compact">
        <a href="index.html" class="brand">
          <div class="brand-mark">B</div>
          <div>
            <div class="brand-name">Bozor Bot</div>
          </div>
        </a>
        <a href="cart.html" class="cart-pill">
          Savatcha <span id="cartCount">0</span>
        </a>
      </header>

      <section class="search-panel">
        <input id="searchInput" type="search" placeholder="Mahsulot qidiring..." />
      </section>

      <section class="section-block no-top">
        <div class="chip-row scrollable" id="categoryChips">
          <button class="chip active" data-category="all">Barchasi</button>
          <button class="chip" data-category="electronics">Elektronika</button>
          <button class="chip" data-category="beauty">Kosmetika</button>
          <button class="chip" data-category="food">Oziq-ovqat</button>
          <button class="chip" data-category="home">Uy uchun</button>
        </div>
      </section>

      <section class="section-block">
        <div class="section-head">
          <h2>Mahsulotlar</h2>
          <select class="sort-select" id="sortSelect">
            <option value="popular">Mashhur</option>
            <option value="cheapest">Arzon</option>
            <option value="expensive">Qimmat</option>
            <option value="new">Yangi</option>
          </select>
        </div>

        <div class="product-grid" id="productList"></div>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="Asosiy navigatsiya">
      <a class="nav-item" href="index.html">
        <span class="nav-ico">⌂</span>
        <span>Home</span>
      </a>
      <a class="nav-item active" href="products.html">
        <span class="nav-ico">◫</span>
        <span>Mahsulot</span>
      </a>
      <a class="nav-item" href="cart.html">
        <span class="nav-ico">🛒</span>
        <span>Savatcha</span>
      </a>
      <a class="nav-item" href="admin.html">
        <span class="nav-ico">☰</span>
        <span>Menyu</span>
      </a>
    </nav>

    <script src="script.js"></script>
  </body>
</html>
